<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cashflow charts</title>
    <style>
      /* Tokens and meanings follow cashflow_with_ml DESIGN.md §3; categorical slots validated for CVD (dataviz). */
      :root {
        --bg: #ffffff; --surface: #fafafa; --surface-2: #f4f4f5; --border: #eaeaea; --border-strong: #d4d4d8;
        --text: #111111; --text-2: #444444; --muted: #6b7587; --grid: rgba(15, 23, 41, 0.07); --tick: #6b7587;
        --c-cash: #2563eb; --c-ml: #e08a00; --c-plan: #8392a8; --c-in: #1ea672; --c-out: #e0516b;
        --pos: #12744d; --neg: #cf3f4c; --warn: #b9780f;
        --k1: #2f7cf6; --k2: #ff8a3d; --k3: #0e9aa7; --k4: #7c5cff; --k5: #d6409f; --k-other: #a1a8b3;
        --sans: "Geist Variable", "Geist", system-ui, -apple-system, sans-serif;
        --mono: "Geist Mono Variable", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #000000; --surface: #0a0a0a; --surface-2: #111111; --border: #222222; --border-strong: #333333;
          --text: #ededed; --text-2: #bbbbbb; --muted: #8f8f8f; --grid: rgba(255, 255, 255, 0.07); --tick: #8f8f8f;
          --c-cash: #3291ff; --c-ml: #f5a623; --c-plan: #737373; --c-in: #4ade80; --c-out: #ff5a5f;
          --pos: #4ade80; --neg: #ff5a5f; --warn: #f5a623;
          --k1: #3291ff; --k2: #c96f0a; --k3: #14a89a; --k4: #8b6cf6; --k5: #e0559f; --k-other: #5c5c5c;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #000000; --surface: #0a0a0a; --surface-2: #111111; --border: #222222; --border-strong: #333333;
        --text: #ededed; --text-2: #bbbbbb; --muted: #8f8f8f; --grid: rgba(255, 255, 255, 0.07); --tick: #8f8f8f;
        --c-cash: #3291ff; --c-ml: #f5a623; --c-plan: #737373; --c-in: #4ade80; --c-out: #ff5a5f;
        --pos: #4ade80; --neg: #ff5a5f; --warn: #f5a623;
        --k1: #3291ff; --k2: #c96f0a; --k3: #14a89a; --k4: #8b6cf6; --k5: #e0559f; --k-other: #5c5c5c;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
      .empty { color: var(--muted); padding: 24px; text-align: center; }
      .demo-bar { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 13px; padding: 8px 12px; margin: -12px -12px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
      .demo-bar a { color: var(--text-2); text-decoration: none; }
      .demo-bar a[aria-current] { color: var(--text); font-weight: 600; }
      .demo-bar .tbtn { margin-left: auto; }

      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-bottom: 10px; }
      .tile, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
      .tile { padding: 12px 14px; min-width: 0; }
      .tile.pred, .panel.pred { border-style: dashed; border-color: color-mix(in srgb, var(--c-ml) 55%, var(--border)); }
      .t-label { font-size: 12.5px; font-weight: 500; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: space-between; }
      .t-value { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; margin-top: 2px; white-space: nowrap; }
      .t-note { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
      .t-spark { display: block; margin-top: 6px; width: 100%; height: 26px; }
      .up { color: var(--pos); } .down { color: var(--neg); }

      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
      .panel { padding: 14px 16px; min-width: 0; }
      .panel.wide { grid-column: 1 / -1; }
      .p-head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
      h2 { font-size: 15px; font-weight: 650; letter-spacing: -0.015em; margin: 0; }
      .sub { font-size: 12.5px; color: var(--muted); margin: 1px 0 0; }
      .p-tools { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
      .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
      .tag.pred { color: var(--warn); border-style: dashed; border-color: var(--c-ml); }
      .tbtn { font: 500 12px var(--sans); color: var(--text-2); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
      .tbtn:hover { border-color: var(--border-strong); color: var(--text); }
      .tbtn:focus-visible { outline: 2px solid var(--c-cash); outline-offset: 2px; }
      .chart { position: relative; height: 260px; margin-top: 10px; }
      .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); margin-top: 8px; }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid currentColor; }
      .legend i.box { width: 10px; height: 10px; border: 0; border-radius: 3px; background: currentColor; }
      .legend i.dash { border-top-style: dashed; }
      .legend i.band { width: 14px; height: 10px; border: 0; border-radius: 2px; background: currentColor; opacity: 0.25; }
      .legend i.tick { width: 3px; height: 12px; border: 0; background: currentColor; }
      .insight { font-size: 13px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; margin: 10px 0 0; }
      .insight b { color: var(--text); font-weight: 600; }

      /* donut */
      .donut { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; margin-top: 10px; }
      .donut .chart { height: 150px; margin: 0; }
      .donut-mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
      .donut-mid b { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
      .donut-mid small { font-size: 11.5px; color: var(--muted); }
      .parts { list-style: none; margin: 0; padding: 0; font-size: 13px; }
      .parts li { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 8px; align-items: center; padding: 3px 0; }
      .parts i { width: 10px; height: 10px; border-radius: 3px; }
      @media (max-width: 420px) { .donut { grid-template-columns: 1fr; } }

      /* bullet rows (progress vs target) and funnel */
      .rows { margin-top: 10px; display: grid; gap: 10px; }
      .row-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
      .row-head .fig { color: var(--text-2); }
      .track { position: relative; height: 12px; margin-top: 4px; background: var(--grid); border-radius: 4px; }
      .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--c-cash); }
      .target { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
      .proj { position: absolute; top: -2px; bottom: -2px; width: 3px; border-radius: 1px; background: var(--c-ml); }
      .funnel .track { background: none; height: 22px; }
      .funnel .fill { left: 50%; transform: translateX(-50%); right: auto; }
      .funnel .row-head { justify-content: center; gap: 10px; }

      .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
      th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); padding: 4px 8px 6px 0; }
      td { border-bottom: 1px solid var(--border); padding: 6px 8px 6px 0; }
      th.r, td.r { text-align: right; }
      .tablewrap { overflow-x: auto; }
      .fine { font-size: 12px; color: var(--muted); margin-top: 10px; }

      /* interactive table */
      th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
      th button:focus-visible { outline: 2px solid var(--c-cash); outline-offset: 2px; border-radius: 3px; }
      th.r button { flex-direction: row-reverse; }
      .sort { font-size: 9px; color: var(--text-2); width: 8px; }
      tbody tr:hover td { background: var(--surface-2); }
      tr.flag td { background: color-mix(in srgb, var(--c-out) 12%, transparent); }
      tr.flag td:first-child { box-shadow: inset 3px 0 0 var(--c-out); padding-left: 8px; }
      .t-filter, .s-input, .b-topic { font: 13px var(--sans); color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: 100%; margin-top: 10px; }
      .t-filter:focus, .s-input:focus, .b-topic:focus { outline: none; border-color: var(--c-cash); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-cash) 18%, transparent); }
      .t-foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 6px; }
      .t-foot:empty { display: none; }
      .t-foot .fine { margin: 0; }

      /* chips, alerts, toolbar, buttons */
      .p-ask { margin-top: 8px; display: flex; gap: 6px; }
      .chip { font: 500 12.5px var(--sans); color: var(--text); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
      .chip:hover { border-color: var(--c-cash); }
      .chip.ghost { padding: 4px 9px; color: var(--muted); }
      .alert { font-size: 13px; border: 1px solid var(--c-out); background: color-mix(in srgb, var(--c-out) 9%, var(--surface)); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; color: var(--text); }
      .alert.ok { border-color: color-mix(in srgb, var(--c-in) 60%, var(--border)); background: color-mix(in srgb, var(--c-in) 8%, var(--surface)); }
      .primary { font: 600 13px var(--sans); color: #fff; background: var(--c-cash); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
      .primary.sm { padding: 4px 12px; font-size: 12.5px; }
      .primary:disabled { opacity: 0.5; cursor: default; }
      .primary:focus-visible, .chip:focus-visible, .card:focus-visible { outline: 2px solid var(--c-cash); outline-offset: 2px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px; }
      .tb-right { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .fs { float: right; margin: 0 0 8px 8px; }
      .toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 12.5px; padding: 6px 12px; border-radius: 8px; margin: 0; max-width: 90vw; z-index: 5; }
      .loading { color: var(--muted); padding: 18px; text-align: center; }
      .tag { display: inline-block; }

      /* search */
      .search { position: relative; display: flex; align-items: center; gap: 8px; }
      .search .s-input { margin: 0; padding-left: 30px; padding-right: 96px; font-size: 14px; height: 38px; }
      .s-icon { position: absolute; left: 10px; color: var(--muted); font-size: 16px; }
      .s-count { position: absolute; right: 36px; margin: 0; pointer-events: none; }
      .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 10px 0; }
      .card { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; text-align: left; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
      .card:hover { border-color: var(--border-strong); background: var(--surface-2); }
      .card:hover .c-go { opacity: 1; }
      .c-text { display: grid; min-width: 0; }
      .c-text b { font-size: 13px; font-weight: 600; }
      .c-text small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .c-go { font-size: 12px; color: var(--c-cash); opacity: 0; }
      .sketch { width: 48px; height: 32px; color: var(--c-cash); }
      .open-item { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
      .o-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .o-bar .fine { margin: 0; }

      /* report builder */
      .builder h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
      .b-head { display: flex; gap: 10px; align-items: center; }
      .b-head .b-topic { margin: 0; font-size: 15px; font-weight: 600; }
      .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; flex-shrink: 0; }
      .seg button { font: 500 12.5px var(--sans); color: var(--text-2); background: none; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
      .seg button[aria-checked="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border-strong); }
      .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
      .pick { display: grid; grid-template-columns: 16px 48px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; cursor: pointer; background: var(--bg); }
      .pick:has(input:checked) { border-color: var(--c-cash); background: color-mix(in srgb, var(--c-cash) 6%, var(--bg)); }
      .pick input { accent-color: var(--c-cash); width: 16px; height: 16px; margin: 0; }
      details { margin-top: 12px; }
      summary { cursor: pointer; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
      .b-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
      .b-foot .fine { margin: 0; }
      .msg { width: 100%; min-height: 240px; font: 13.5px/1.6 var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; resize: vertical; }
      .msg:focus { outline: none; border-color: var(--c-cash); }
      .report-doc h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 4px 0 12px; }
      @media (max-width: 520px) { .b-head { flex-direction: column; align-items: stretch; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="empty">Loading…</div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
